<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02050a,.065);

function ring(r,rx,rz,c,o){const pts=[];for(let i=0;i<220;i++){const a=i/220*Math.PI*2,w=.045*Math.sin(a*3)+.012*Math.sin(a*11);pts.push(new THREE.Vector3(Math.cos(a)*(r+w),Math.sin(a)*(r*.43),.16*Math.sin(a*2)))}const curve=new THREE.CatmullRomCurve3(pts,true);const m=new THREE.Mesh(new THREE.TubeGeometry(curve,320,.008,5,true),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false}));m.rotation.x=rx;m.rotation.z=rz;root.add(m);return m}const r1=ring(1.9,.48,.1,0x76efff,.24),r2=ring(1.84,-.65,.86,0x688fff,.19),r3=ring(1.79,.98,-.7,0xd8fdff,.12);

function load(i=0){if(i>=urls.length){fail('3D‑модель не загрузилась.');return}statusEl.textContent='Загрузка 3D‑головы '+(i+1)+'/'+urls.length+'…';loader.load(urls[i],g=>{const model=g.scene;const b0=new THREE.Box3().setFromObject(model),s0=b0.getSize(new THREE.Vector3()),mx=Math.max(s0.x,s0.y,s0.z);model.scale.setScalar(2.65/mx);const b1=new THREE.Box3().setFromObject(model),c=b1.getCenter(new THREE.Vector3());model.position.sub(c);const hg=new THREE.Group();hg.add(model);hg.rotation.y=Math.PI;hg.position.z=.5;root.add(hg);const meshes=[];model.traverse(o=>{if(o.isMesh&&o.geometry)meshes.push(o)});meshes.forEach(o=>{o.material=new THREE.ShaderMaterial({vertexShader:v,fragmentShader:f,transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});const w=new THREE.Mesh(o.geometry,new THREE.MeshBasicMaterial({color:0xa6f7ff,wireframe:true,transparent:true,opacity:.085,blending:THREE.AdditiveBlending,depthWrite:false}));w.position.copy(o.position);w.rotation.copy(o.rotation);w.scale.copy(o.scale);o.parent.add(w);const q=new THREE.Points(o.geometry,new THREE.PointsMaterial({color:0xd1fdff,size:.0065,transparent:true,opacity:.12,blending:THREE.AdditiveBlending,depthWrite:false}));q.position.copy(o.position);q.rotation.copy(o.rotation);q.scale.copy(o.scale);o.parent.add(q)});statusEl.textContent='REAL 3D HEAD // READY';},e=>{if(e.total)statusEl.textContent='Загрузка 3D‑головы… '+Math.round(e.loaded/e.total*100)+'%'},()=>load(i+1))}load();
let px=0,py=0;addEventListener('pointermove',e=>{px=e.clientX/innerWidth-.5;py=e.clientY/innerHeight-.5},{passive:true});const clk=new THREE.Clock();function tick(){requestAnimationFrame(tick);const t=clk.getElapsedTime();root.rotation.y+=(px*.08-root.rotation.y)*.025;root.rotation.x+=(-py*.04-root.rotation.x)*.025;r1.rotation.z+=.001;r2.rotation.y-=.0008;r3.rotation.x+=.0007;dust.rotation.y=t*.012;shell.rotation.y=t*.016;sphereMat.emissiveIntensity=.47+Math.sin(t*1.2)*.05;renderer.render(scene,camera)}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
