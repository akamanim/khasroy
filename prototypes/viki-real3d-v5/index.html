<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Khasroy VIKI Projection v5 — Real 3D Head</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(900px 700px at 50% 46%,rgba(24,95,170,.18),transparent 65%),linear-gradient(180deg,#07101d 0%,#02050a 72%);color:#dffaff}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.top{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);z-index:10;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(220,248,255,.50);white-space:nowrap;pointer-events:none}.panel{position:fixed;left:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:10;max-width:min(420px,calc(100vw - 32px));padding:11px 13px;border-radius:14px;background:rgba(3,8,16,.34);border:1px solid rgba(145,231,255,.11);backdrop-filter:blur(12px);color:rgba(215,241,250,.66);font-size:11px;line-height:1.45}.status{display:inline-flex;align-items:center;gap:7px;margin-bottom:5px;color:rgba(235,252,255,.84)}.dot{width:7px;height:7px;border-radius:50%;background:#a8f6ff;box-shadow:0 0 14px rgba(95,225,255,.85)}.error{color:#ffc8c8;display:none;margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<div class="top">KHASROY // REAL 3D SURFACE PROJECTION</div>
<div class="panel"><div class="status"><span class="dot"></span><span id="status">Загрузка 3D‑головы…</span></div><div>v5: настоящий GLB‑mesh + Three.js + wireframe + points + Fresnel + bloom.</div><div class="error" id="error"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/UnrealBloomPass.js';
const app=document.getElementById('app');const statusEl=document.getElementById('status');const errorEl=document.getElementById('error');
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02050a,0.08);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.01,100);camera.position.set(0,0.05,5.0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x02050a,0);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;app.appendChild(renderer.domElement);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.28,0.75,0.06);composer.addPass(bloom);
const root=new THREE.Group();scene.add(root);scene.add(new THREE.HemisphereLight(0x8eeaff,0x071020,0.42));
const key=new THREE.PointLight(0xb7f8ff,14,12,2);key.position.set(-2.2,1.6,3.3);scene.add(key);const rim=new THREE.PointLight(0x4c79ff,10,12,2);rim.position.set(2.6,0.4,-1.8);scene.add(rim);const under=new THREE.PointLight(0x55ddff,5.5,10,2);under.position.set(0,-2.4,1.2);scene.add(under);
const sphereGeo=new THREE.SphereGeometry(1.55,96,96);const sphereMat=new THREE.MeshPhysicalMaterial({color:0x17406f,emissive:0x0b3159,emissiveIntensity:0.48,transparent:true,opacity:0.105,roughness:0.28,metalness:0.05,transmission:0.42,thickness:0.6,side:THREE.DoubleSide,depthWrite:false});const sphere=new THREE.Mesh(sphereGeo,sphereMat);sphere.scale.set(1.02,1.10,0.92);root.add(sphere);
const outer=new THREE.Mesh(new THREE.SphereGeometry(1.62,64,64),new THREE.MeshBasicMaterial({color:0x92efff,transparent:true,opacity:0.025,wireframe:true,blending:THREE.AdditiveBlending,depthWrite:false}));outer.scale.copy(sphere.scale);root.add(outer);
function makeOrbit(radius,tube,color,opacity,tiltX,tiltZ){const pts=[];for(let i=0;i<260;i++){const a=i/260*Math.PI*2;const wobble=0.055*Math.sin(a*3.0)+0.018*Math.sin(a*9.0);pts.push(new THREE.Vector3(Math.cos(a)*(radius+wobble),Math.sin(a)*(radius*0.42),0.18*Math.sin(a*2.0)));}const curve=new THREE.CatmullRomCurve3(pts,true,'centripetal',0.5);const geo=new THREE.TubeGeometry(curve,420,tube,6,true);const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false});const mesh=new THREE.Mesh(geo,mat);mesh.rotation.x=tiltX;mesh.rotation.z=tiltZ;root.add(mesh);return mesh;}
const orbitA=makeOrbit(1.78,.008,0x78efff,.26,0.42,0.10);const orbitB=makeOrbit(1.72,.007,0x648dff,.22,-0.62,0.82);const orbitC=makeOrbit(1.68,.006,0xd2fcff,.14,0.92,-0.72);
const dustCount=innerWidth<600?900:1800;const dustPos=new Float32Array(dustCount*3);for(let i=0;i<dustCount;i++){const a=Math.random()*Math.PI*2;const u=Math.random()*2-1;const rr=1.72+Math.random()*0.52;const s=Math.sqrt(1-u*u);dustPos[i*3]=Math.cos(a)*s*rr;dustPos[i*3+1]=u*rr*0.92;dustPos[i*3+2]=Math.sin(a)*s*rr;}const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xa8f5ff,size:0.013,transparent:true,opacity:0.30,blending:THREE.AdditiveBlending,depthWrite:false}));root.add(dust);
const fresnelVertex=`varying vec3 vNormal; varying vec3 vView; void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); vNormal=normalize(normalMatrix*normal); vView=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`;
const fresnelFragment=`varying vec3 vNormal; varying vec3 vView; void main(){ float fres=pow(1.0-max(dot(normalize(vNormal),normalize(vView)),0.0),2.2); float center=pow(max(dot(normalize(vNormal),normalize(vView)),0.0),3.0); vec3 edge=vec3(0.46,0.92,1.0); vec3 core=vec3(0.32,0.58,1.0); vec3 col=mix(core,edge,clamp(fres*1.3,0.0,1.0)); float alpha=0.06+fres*0.52+center*0.05; gl_FragColor=vec4(col,alpha); }`;
const loader=new GLTFLoader();const MODEL_URL='https://cdn.jsdelivr.net/gh/ibrews/VitruvianGodot@main/godot_project/vitruvian_head.glb';
loader.load(MODEL_URL,(gltf)=>{const model=gltf.scene;const initialBox=new THREE.Box3().setFromObject(model);const initialSize=initialBox.getSize(new THREE.Vector3());const maxDim=Math.max(initialSize.x,initialSize.y,initialSize.z);model.scale.setScalar(2.52/maxDim);const normalizedBox=new THREE.Box3().setFromObject(model);const center=normalizedBox.getCenter(new THREE.Vector3());model.position.sub(center);const finalBox=new THREE.Box3().setFromObject(model);const finalSize=finalBox.getSize(new THREE.Vector3());model.position.y-=finalSize.y*0.02;const headGroup=new THREE.Group();headGroup.add(model);headGroup.rotation.y=Math.PI;headGroup.rotation.x=-0.02;headGroup.position.z=0.43;root.add(headGroup);model.traverse((obj)=>{if(!obj.isMesh||!obj.geometry)return;obj.material=new THREE.ShaderMaterial({vertexShader:fresnelVertex,fragmentShader:fresnelFragment,transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});const wire=new THREE.Mesh(obj.geometry,new THREE.MeshBasicMaterial({color:0x98f1ff,wireframe:true,transparent:true,opacity:0.13,blending:THREE.AdditiveBlending,depthWrite:false}));wire.morphTargetDictionary=obj.morphTargetDictionary;wire.morphTargetInfluences=obj.morphTargetInfluences;wire.position.copy(obj.position);wire.rotation.copy(obj.rotation);wire.scale.copy(obj.scale);obj.parent.add(wire);if(obj.geometry.attributes.position){const pts=new THREE.Points(obj.geometry,new THREE.PointsMaterial({color:0xbef8ff,size:0.008,transparent:true,opacity:0.16,blending:THREE.AdditiveBlending,depthWrite:false}));pts.morphTargetDictionary=obj.morphTargetDictionary;pts.morphTargetInfluences=obj.morphTargetInfluences;pts.position.copy(obj.position);pts.rotation.copy(obj.rotation);pts.scale.copy(obj.scale);obj.parent.add(pts);}});model.traverse((obj)=>{if(!obj.isMesh||!obj.morphTargetDictionary||!obj.morphTargetInfluences)return;const dict=obj.morphTargetDictionary;const influences=obj.morphTargetInfluences;for(const [name,value] of [['Thinking',0.10],['Eyes_Closed_Max',0.0],['Jaw_Lower',0.035],['Mouth_Large_Opened',0.015]]){if(dict[name]!==undefined)influences[dict[name]]=value;}});statusEl.textContent='REAL 3D HEAD // READY';},(evt)=>{if(evt.total)statusEl.textContent='Загрузка 3D‑головы… '+Math.round(evt.loaded/evt.total*100)+'%';},(err)=>{console.error(err);statusEl.textContent='MODEL LOAD ERROR';errorEl.style.display='block';errorEl.textContent='Не удалось загрузить GLB. Открой страницу через обычный Safari/Chrome, не файловый предпросмотр.';});
let pointerX=0,pointerY=0;addEventListener('pointermove',(e)=>{pointerX=e.clientX/innerWidth-.5;pointerY=e.clientY/innerHeight-.5;},{passive:true});const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();root.rotation.y+=(pointerX*.10-root.rotation.y)*.025;root.rotation.x+=(-pointerY*.045-root.rotation.x)*.025;orbitA.rotation.z+=.0012;orbitB.rotation.y-=.0010;orbitC.rotation.x+=.0008;dust.rotation.y=t*.012;outer.rotation.y=t*.018;sphereMat.emissiveIntensity=.44+Math.sin(t*1.25)*.06;composer.render();}animate();function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));}addEventListener('resize',resize);
</script>
</body>
</html>
