services:
  khasroy-web:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      - khasroy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - khasroy-web
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - khasroy

networks:
  khasroy:

volumes:
  caddy_data:
  caddy_config:
