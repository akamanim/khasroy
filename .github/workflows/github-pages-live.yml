name: Khasroy Free Live Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-live/**'
      - '.github/workflows/github-pages-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-live

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
