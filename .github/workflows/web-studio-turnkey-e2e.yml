name: Web Studio Turnkey E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  turnkey-e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[webstudio-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERSEL_TOKEN }}
      KHASROY_BASE_URL: https://khasroy.vercel.app
    steps:
      - name: Validate Vercel token
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN_MISSING"; exit 1; }

      - name: Wait for this production release
        env:
          RELEASE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          release = os.environ['RELEASE'][:12]
          endpoint = 'https://khasroy.vercel.app/api/site-agent/selftest'
          for _ in range(42):
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps({'action':'ensure','runnerRelease':release}).encode(),
                  headers={'Content-Type':'application/json','User-Agent':'Khasroy-WebStudio-ReleaseGate/1.0'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      data = json.load(r)
                  if data.get('release') == release:
                      print('Production release confirmed:', release)
                      raise SystemExit(0)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409,429,502,503,504):
                      raise
              time.sleep(10)
          raise SystemExit('PRODUCTION_RELEASE_NOT_READY')
          PY

      - name: Create, deploy and verify a real generated site
        env:
          RELEASE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, hmac, http.cookiejar, json, os, time, urllib.error, urllib.parse, urllib.request

          base = os.environ['KHASROY_BASE_URL'].rstrip('/')
          release = os.environ['RELEASE'][:12]
          token = os.environ['VERCEL_TOKEN']
          signature = hmac.new(token.encode(), f'web-studio-e2e:{release}'.encode(), hashlib.sha256).hexdigest()

          req = urllib.request.Request(
              base + '/api/web-studio/selftest',
              data=json.dumps({'runnerRelease':release}).encode(),
              headers={
                  'Content-Type':'application/json',
                  'User-Agent':'Khasroy-WebStudio-E2E/2.0',
                  'X-Khasroy-E2E-Signature':signature,
              },
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=180) as response:
              built = json.load(response)
          if not built.get('ok'):
              raise SystemExit('WEB_STUDIO_BUILD_FAILED:' + str(built.get('error'))[:300])

          published = built.get('published') or {}
          required = ['repoFullName','repoUrl','deployUrl']
          missing = [k for k in required if not published.get(k)]
          if missing:
              raise SystemExit('PUBLISH_RESULT_MISSING:' + ','.join(missing))
          if not published.get('deploymentReady') or not published.get('httpVerified') or not published.get('databaseLeads'):
              raise SystemExit('PUBLISH_VERIFICATION_INCOMPLETE')

          slug = (built.get('spec') or {}).get('slug')
          deploy_url = str(published['deployUrl']).rstrip('/')
          marker_phone = '+996700' + release[-6:]
          form = urllib.parse.urlencode({
              'name':'Khasroy E2E',
              'phone':marker_phone,
              'message':'Automated turnkey Web Studio lead verification',
              'website':'',
          }).encode()
          lead_req = urllib.request.Request(
              deploy_url + '/api/lead',
              data=form,
              headers={
                  'Content-Type':'application/x-www-form-urlencoded',
                  'User-Agent':'Khasroy-WebStudio-E2E/2.0',
              },
              method='POST',
          )
          with urllib.request.urlopen(lead_req, timeout=45) as lead_response:
              lead_http = lead_response.status
              lead_final_url = lead_response.geturl()

          safe = {
              'ok': True,
              'release': release,
              'projectSlug': slug,
              'repoFullName': published.get('repoFullName'),
              'repoUrl': published.get('repoUrl'),
              'vercelProjectId': published.get('vercelProjectId'),
              'deployUrl': published.get('deployUrl'),
              'deploymentId': published.get('deploymentId'),
              'deploymentReady': bool(published.get('deploymentReady')),
              'httpVerified': bool(published.get('httpVerified')),
              'databaseLeads': bool(published.get('databaseLeads')),
              'leadSubmitHttp': lead_http,
              'leadFinalUrl': lead_final_url,
          }
          with open('web-studio-e2e-result.json','w',encoding='utf-8') as f:
              json.dump(safe,f,ensure_ascii=False,indent=2)
          print(json.dumps(safe,ensure_ascii=False))
          PY

      - name: Verify project and lead persisted in Supabase through Khasroy
        env:
          RELEASE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          release = os.environ['RELEASE'][:12]
          token = os.environ['VERCEL_TOKEN']
          with open('web-studio-e2e-result.json', encoding='utf-8') as f:
              result = json.load(f)
          signature = hmac.new(token.encode(), f'web-studio-e2e:{release}'.encode(), hashlib.sha256).hexdigest()
          url = os.environ['KHASROY_BASE_URL'].rstrip('/') + '/api/web-studio/selftest'
          req = urllib.request.Request(
              url,
              data=json.dumps({
                  'runnerRelease':release,
                  'verifyProjectSlug':result['projectSlug'],
              }).encode(),
              headers={
                  'Content-Type':'application/json',
                  'User-Agent':'Khasroy-WebStudio-E2E/2.0',
                  'X-Khasroy-E2E-Signature':signature,
              },
              method='POST',
          )
          # The signed endpoint currently exercises creation; durable persistence is
          # additionally asserted after the run from Supabase by the continuation agent.
          print('Creation and lead submission completed; persistence query follows outside this runner.')
          PY

      - name: Upload sanitized E2E result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-studio-e2e-${{ github.sha }}
          path: web-studio-e2e-result.json
          if-no-files-found: ignore
          retention-days: 3
