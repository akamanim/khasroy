name: Web Studio Turnkey E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  turnkey-e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[webstudio-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERSEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Validate deployment credential
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN_MISSING"; exit 1; }

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Resolve Vercel project settings
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/vercel-project.json \
            --write-out "%{http_code}" \
            "https://api.vercel.com/v9/projects/khasroy" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json")
          test "$HTTP_CODE" = "200" || { echo "VERCEL_PROJECT_LOOKUP_FAILED_HTTP_$HTTP_CODE"; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const project = JSON.parse(fs.readFileSync('/tmp/vercel-project.json', 'utf8'));
          if (!project.id || !project.accountId) {
            console.error('VERCEL_PROJECT_RESPONSE_INCOMPLETE');
            process.exit(1);
          }
          let analyticsId;
          if (project.analytics?.id && (!project.analytics.disabledAt || (project.analytics.enabledAt && project.analytics.enabledAt > project.analytics.disabledAt))) {
            analyticsId = project.analytics.id;
          }
          const projectJson = {
            projectId: project.id,
            orgId: project.accountId,
            projectName: project.name || 'khasroy',
            settings: {
              createdAt: project.createdAt ?? null,
              framework: project.framework ?? null,
              devCommand: project.devCommand ?? null,
              installCommand: project.installCommand ?? null,
              buildCommand: project.buildCommand ?? null,
              outputDirectory: project.outputDirectory ?? null,
              rootDirectory: project.rootDirectory ?? null,
              directoryListing: project.directoryListing ?? false,
              nodeVersion: project.nodeVersion ?? '22.x',
              ...(analyticsId ? { analyticsId } : {})
            }
          };
          fs.mkdirSync('.vercel', { recursive: true });
          fs.writeFileSync('.vercel/project.json', JSON.stringify(projectJson, null, 2));
          fs.appendFileSync(process.env.GITHUB_ENV, `VERCEL_PROJECT_ID=${project.id}\nVERCEL_ORG_ID=${project.accountId}\n`);
          console.log(`Resolved project: ${projectJson.projectName}`);
          NODE

      - name: Pull project production environment through REST API
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/vercel-env.json \
            --write-out "%{http_code}" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?decrypt=true&source=vercel-cli%3Apull" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json")
          test "$HTTP_CODE" = "200" || { echo "VERCEL_ENV_LOOKUP_FAILED_HTTP_$HTTP_CODE"; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/vercel-env.json', 'utf8'));
          const envs = Array.isArray(payload.envs) ? payload.envs : [];
          const production = envs.filter(env => {
            const target = Array.isArray(env.target) ? env.target : [env.target];
            return target.includes('production') && typeof env.key === 'string' && typeof env.value !== 'undefined';
          });
          const deduped = new Map();
          for (const env of production) deduped.set(env.key, String(env.value ?? ''));
          const lines = [...deduped.entries()].map(([key, value]) => `${key}=${JSON.stringify(value)}`);
          fs.writeFileSync('.vercel/.env.production.local', lines.join('\n') + (lines.length ? '\n' : ''));
          console.log(`Prepared ${lines.length} project production environment variables.`);
          NODE

      - name: Build Khasroy production bundle
        run: npx --yes vercel@latest build --prod

      - name: Verify prebuilt output
        shell: bash
        run: |
          test -f .vercel/output/config.json || { echo "PREBUILT_OUTPUT_MISSING"; exit 1; }
          echo "PREBUILT_OUTPUT_READY"

      - name: Deploy this commit to Khasroy production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "VERCEL_DEPLOY_RETRY_$attempt"
              sleep $((attempt * 20))
            fi
          done
          echo "VERCEL_DEPLOY_FAILED_AFTER_RETRIES"
          exit 1

      - name: Confirm this Khasroy release is live
        env:
          RELEASE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          release = os.environ['RELEASE'][:12]
          endpoint = 'https://khasroy.vercel.app/api/site-agent/selftest'
          for _ in range(24):
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps({'action':'ensure','runnerRelease':release}).encode(),
                  headers={'Content-Type':'application/json','User-Agent':'Khasroy-WebStudio-ReleaseGate/3.0'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      data = json.load(r)
                  if data.get('release') == release:
                      print('Production release confirmed:', release)
                      raise SystemExit(0)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409,429,502,503,504):
                      raise
              time.sleep(5)
          raise SystemExit('PRODUCTION_RELEASE_NOT_READY')
          PY

      - name: Run OIDC-authenticated turnkey Web Studio test
        env:
          RELEASE: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE=$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=khasroy-webstudio-e2e")
          OIDC_TOKEN=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(1); process.stdout.write(x.value)' "$OIDC_RESPONSE")
          echo "::add-mask::$OIDC_TOKEN"
          HTTP_CODE=$(curl --silent --show-error \
            --max-time 180 \
            --output web-studio-e2e-result.json \
            --write-out "%{http_code}" \
            -X POST "https://khasroy.vercel.app/api/web-studio/selftest" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"runnerRelease\":\"${RELEASE:0:12}\"}")
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("web-studio-e2e-result.json","utf8")); console.log(JSON.stringify(p)); if(process.argv[1]!=="200" || !p.ok) process.exit(1);' "$HTTP_CODE"

      - name: Upload sanitized E2E result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-studio-e2e-${{ github.sha }}
          path: web-studio-e2e-result.json
          if-no-files-found: ignore
          retention-days: 3
