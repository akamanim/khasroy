name: Follow-up RPC Security

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "tests/followup-rpc-security.mjs"
      - ".github/workflows/followup-rpc-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: node tests/followup-rpc-security.mjs
