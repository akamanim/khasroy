name: Image Exam Integrity Gate

on:
  pull_request:
    paths:
      - 'scripts/image-exam-integrity-gate.mjs'
      - 'scripts/validate-generated-image.mjs'
      - 'tests/image-exam-integrity-gate.mjs'
      - '.github/workflows/image-exam-integrity-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic integrity bridge test
        run: node tests/image-exam-integrity-gate.mjs
