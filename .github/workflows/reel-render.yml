name: Reel render

# Renders a reel plan to MP4 with the in-repo runtime (reels/). Khasroy will dispatch this with a
# plan; it can also be run by hand with a plan file from reels/plans.
on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: "Plan file in the repo (used when plan_json is empty)"
        required: false
        default: "reels/plans/iinna-demo.json"
      plan_json:
        description: "Plan JSON (overrides plan_path)"
        required: false
        default: ""
      job_id:
        description: "Khasroy job id, used in the artifact name"
        required: false
        default: "manual"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Write plan
        env:
          PLAN_JSON: ${{ inputs.plan_json }}
          PLAN_PATH: ${{ inputs.plan_path }}
        run: |
          if [ -n "$PLAN_JSON" ]; then printf '%s' "$PLAN_JSON" > plan.json; else cp "$PLAN_PATH" plan.json; fi
          python -c "import json; json.load(open('plan.json'))"
      - name: Render
        run: python reels/render.py plan.json reel.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.job_id }}
          path: reel.mp4
          retention-days: 14
