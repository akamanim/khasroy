name: Site Agent Self-Test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-agent-selftest
  cancel-in-progress: true

jobs:
  prombaza-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait for current production release
        env:
          RELEASE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          expected = os.environ["RELEASE"]
          for _ in range(45):
              try:
                  with urllib.request.urlopen("https://api.github.com/repos/akamanim/khasroy/commits/main", timeout=15) as r:
                      main_sha = json.load(r)["sha"]
                  if main_sha != expected:
                      print("This workflow was superseded by a newer main commit; exiting.")
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print("Could not verify main commit yet:", exc)
              time.sleep(2)
          PY

      - name: Capture sanitized Gemini runtime probe
        run: |
          python - <<'PY'
          import json, urllib.request
          url = "https://khasroy.vercel.app/api/internal/vision-diagnostic?probe=khasroy-vision-probe-9f83c2d7"
          result = {"probeFetchOk": False}
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "Khasroy-GitHub-Diagnostic/1.0"})
              with urllib.request.urlopen(req, timeout=45) as r:
                  data = json.load(r)
              allowed = [
                  "release", "geminiConfigured", "credentialSource", "model",
                  "imageStatus", "imageMime", "imageBytes", "imageUsable", "imageError",
                  "geminiStatus", "geminiOk", "geminiTextPresent", "geminiJsonValid",
                  "geminiErrorCode", "geminiErrorStatus", "geminiError",
              ]
              result = {"probeFetchOk": True, **{k: data.get(k) for k in allowed if k in data}}
          except Exception as exc:
              result = {"probeFetchOk": False, "transportError": type(exc).__name__}
          with open("vision-probe.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Upload vision probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: vision-probe-${{ github.sha }}
          path: vision-probe.json
          if-no-files-found: error
          retention-days: 1

      - name: Run resumable PROMBAZA self-test
        env:
          RELEASE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          endpoint = "https://khasroy.vercel.app/api/site-agent/selftest"
          release = os.environ["RELEASE"][:12]
          action = "ensure"

          def current_main():
              with urllib.request.urlopen("https://api.github.com/repos/akamanim/khasroy/commits/main", timeout=15) as r:
                  return json.load(r)["sha"]

          for attempt in range(240):
              try:
                  if attempt % 8 == 0 and current_main()[:12] != release:
                      print("A newer release replaced this one; stopping old self-test runner.")
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print("Main-commit check failed temporarily:", exc)

              payload = json.dumps({"action": action, "runnerRelease": release}).encode()
              req = urllib.request.Request(
                  endpoint,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Khasroy-GitHub-SelfTest/1.0",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(req, timeout=75) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")[:500]
                  if exc.code == 409:
                      print("Production has not switched to this release yet; retrying…", body)
                      time.sleep(8)
                      continue
                  if exc.code in (429, 502, 503, 504):
                      print(f"Temporary HTTP {exc.code}; retrying current step…", body)
                      time.sleep(10)
                      continue
                  raise
              except Exception as exc:
                  print("Transport error; retrying current step:", exc)
                  time.sleep(8)
                  continue

              status = data.get("status")
              progress = data.get("progress") or data.get("stage") or status
              print(f"[{attempt + 1}] {progress}")

              if status == "done":
                  print("\n===== FINAL SELF-TEST REPORT =====\n")
                  print(data.get("content") or "Completed without report text")
                  raise SystemExit(0)
              if status == "failed":
                  print("Self-test failed:", data.get("error") or progress)
                  raise SystemExit(1)

              action = "step"
              delay_ms = data.get("retryAfterMs") or 900
              time.sleep(max(0.7, min(float(delay_ms) / 1000.0, 70.0)))

          raise SystemExit("Self-test did not finish within 240 resumable steps")
          PY
