name: Vercel Prebuilt Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-prebuilt-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERSEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Check Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN_MISSING"
            echo "Add a GitHub Actions repository secret named VERCEL_TOKEN (or temporary fallback VERSEL_TOKEN)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Link Vercel project
        run: npx --yes vercel@latest link --yes --project khasroy --scope akamanim --token="$VERCEL_TOKEN"

      - name: Pull production environment
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build on GitHub runner
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
